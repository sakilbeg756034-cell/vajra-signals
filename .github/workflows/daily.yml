# Roz ka signal build. Laptop yahan kahin nahi aata.
#
# Ye is baat par tika hai ki NSE GitHub ke server ko jawab deta hai. Wo maana
# nahi gaya -- 2026-09-03 ko probe chala kar dekha gaya: Phoenix ke runner se
# bhavcopy, delivery data, niftyindices aur corporate action API, chaaron HTTP
# 200. Probe workflow repo me hi rakha hai taaki NSE kabhi block kare to sawal
# dobara poocha ja sake.
#
# Laptop mahine bhar band reh sakta hai, isliye ye run kisi laptop-run ka
# intezaar nahi karta. Saari jaanch isi run me hoti hai (daily.py ke gates), aur
# fail hone par run RED hota hai -- tab purani out/ file waisi ki waisi rehti
# hai. Galat nayi file likhne se purani sahi file behtar hai.
name: roz ka signal

on:
  schedule:
    # NSE KA BHAVCOPY ~16:33 IST PAR AATA HAI -- 14 September 2026 ko naapa.
    #
    # 26-Aug se 11-Sep 2026 tak har trading din ki file ka Last-Modified
    # 11:02-11:03 UTC tha, yaani 16:32-16:33 IST. Pehle yahan sirf chaar
    # koshish thin (17:50, 18:50, 19:50, 21:20 IST), aur GitHub ke scheduled run
    # roz 3-4 ghante late chalte the: sheet ~22:00 IST par taaza hoti thi, jabki
    # data 16:33 se tayyar tha.
    #
    # Ab 16:37 se 00:22 IST tak HAR 15 MINUTE ek koshish, aur agli subah 06:37
    # par ek aakhri jaal. Jo koshish naya din pakad le wahi commit karti hai.
    # NSE jis din der kare, koshishein apne aap chalti rehti hain.
    #
    # Itni koshish NSE par bojh nahi banti: jab naya din NSE par abhi nahi aaya,
    # `daily.py` sirf EK bhavcopy request karke turant ruk jaata hai --
    # corporate action API aur reference list tabhi maange jaate hain jab sach
    # me naya din aaya ho.
    - cron: "7,22,37,52 11-18 * * 1-5"   # 16:37 se 00:22 IST, har 15 minute
    - cron: "7 1 * * 2-6"                # 06:37 IST agli subah -- aakhri jaal
    # Dopahar ke slot (16-Sep-2026): inme se jo bhi run 11:15 IST ke baad
    # shuru ho, wo aaj ki NSE file ka intezaar karke ~16:35 par signal bana deta
    # hai (neeche "intezaar" wala step).
    - cron: "15,45 5-10 * * 1-5"         # 10:45 se 16:15 IST, har 30 minute
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Do run ek saath state/prices.parquet likhein to file toot jaayegi.
  group: daily-signal
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 355: dopahar ka run NSE file ka ~5 ghante tak intezaar kar sakta hai.
    # Asli kaam ke step apni alag chhoti hadd rakhte hain (neeche).
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # STATE ALAG BRANCH SE AATA HAI -- ye 7 September 2026 ka badlav hai.
      #
      # KYUN: `state/prices.parquet` 25 MB ka hai aur parquet pehle se
      # compressed hota hai, isliye git har din ki POORI NAYI COPY rakhta hai.
      # Naapa gaya: sirf 4 din ke state = 89 MB. Yaani ~22 MB PER TRADING DIN,
      # ~5.5 GB per saal. GitHub 1 GB par chetavni deta hai (2 mahine me) aur
      # 5 GB ke aas-paas push rok deta hai (1 saal me). Uske pehle hi har run
      # ka `actions/checkout` itna dheema ho jaata ki 30-minute timeout par ye
      # workflow FAIL hone lagta -- yaani live signal BAND.
      #
      # ILAAJ: state ab `state` branch par rehta hai, jise har din FORCE-PUSH
      # kiya jaata hai -- sirf EK commit, koi itihaas nahi. Repo hamesha chhota.
      # `out/` (chhoti CSV) main par hi rehti hai aur uska poora itihaas
      # bachta hai -- wahi to record hai ki system ne kis din kya kaha.
      - name: State laao (state branch se)
        run: |
          git fetch --depth 1 origin state &&             git checkout FETCH_HEAD -- state || {
              echo "::error::state branch se state nahi mila."
              echo "Pehli baar chala rahe ho to pehle state branch banao."
              exit 1
            }

          # ---- INDEX SE STATE HATAO. YE LINE HATANA MAT. ----
          #
          # `git checkout <ref> -- <path>` file ko working tree me laata hai
          # AUR use INDEX me STAGE bhi kar deta hai. Yahi ek baat thi jisne
          # 7 September 2026 wale poore "state ko alag branch par le jao"
          # fix ko nakaam kar diya.
          #
          # Kaise: neeche `git add out` ke baad `git diff --cached` khaali
          # nahi hota -- kyunki `state/` pehle se staged pada hai. Isliye
          # har roz ka commit `out/` ke saath 25 MB ka `state/prices.parquet`
          # bhi main par le jaata tha. .gitignore me `state/` likha hona kaam
          # nahi aata, kyunki ignore sirf UNTRACKED file par lagta hai --
          # jo cheez khud stage kar di gayi ho uspar nahi.
          #
          # Naapa gaya (8-Sep-2026): 7-Sep ke fix ke TURANT BAAD wale run se
          # hi state dobara main par chala gaya, aur chaar run me repo 90 MB
          # ka ho gaya. Yaani wo saara khatra jyon ka tyon wapas aa gaya tha
          # jo us fix ne hataya tha: ~22 MB per trading din, ~5.5 GB per
          # saal, aur uske pehle hi har run ka checkout itna dheema ki 30
          # minute ka timeout lag jaye -- matlab LIVE SIGNAL BAND.
          #
          # `git reset -- state` sirf INDEX saaf karta hai. File working
          # tree me jyon ki tyon rehti hai (engine ko wahi chahiye), bas
          # commit me nahi jaati.
          git reset -q -- state

          echo "index me kya staged hai (state yahan NAHI dikhna chahiye):"
          git diff --cached --name-only
          ls -la state

          # Har 15 minute ki koshish me aksar naya din nahi hota. Tab state
          # badalta hi nahi, aur state branch par faltu force-push nahi hona
          # chahiye. Uske liye run se PEHLE ka hisaab yahan rakha jaata hai.
          sha256sum state/* > "$RUNNER_TEMP/state.before"

      # AAJ KI NSE FILE KA INTEZAAR -- 16 September 2026.
      #
      # GitHub scheduled run apne tay waqt par nahi chalata: 14-15 Sep ko har
      # 15 minute ke slot me se lagbhag ek hi run chala, aur wo bhi ghanton
      # der se (22:32, 02:24, 11:35, 21:02 IST). NSE file ~16:33 IST aati hai.
      # Isliye jo scheduled run dopahar/shaam (11:15-19:30 IST, Mon-Fri) me
      # shuru ho, wo "file nahi aayi" dekh kar band nahi hota: har 5 minute
      # sirf EK HEAD request se aaj ki file dekhta hai, aur file aate hi 60
      # second ruk kar aage badhta hai. Seema: 320 minute ya 19:30 IST, jo
      # pehle aaye. Uske baad (chhutti / NSE late) chup-chaap aage -- daily.py
      # naya din na ho to khud ruk jaata hai, aur raat ke run pehle jaise hain.
      # Haath se chalaya run (workflow_dispatch) kabhi intezaar nahi karta.
      - name: Aaj ki NSE file ka intezaar (sirf dopahar/shaam ke scheduled run me)
        timeout-minutes: 330
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -u
          if [ "$EVENT" != "schedule" ]; then
            echo "haath se chalaya run -- intezaar nahi"
            exit 0
          fi
          DOW=$(TZ=Asia/Kolkata date +%u)
          HM=$(TZ=Asia/Kolkata date +%H%M)
          if [ "$DOW" -gt 5 ] || [ "$HM" -lt 1115 ] || [ "$HM" -ge 1930 ]; then
            echo "abhi intezaar ka waqt nahi (din $DOW, $HM IST)"
            exit 0
          fi
          DAY=$(TZ=Asia/Kolkata date +%Y%m%d)
          URL="https://nsearchives.nseindia.com/content/cm/BhavCopy_NSE_CM_0_0_0_${DAY}_F_0000.csv.zip"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          DEADLINE=$(( $(date +%s) + 320 * 60 ))
          UNTIL_1930=$(TZ=Asia/Kolkata date -d "today 19:30" +%s)
          if [ "$UNTIL_1930" -lt "$DEADLINE" ]; then DEADLINE=$UNTIL_1930; fi
          while true; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -I -A "$UA" -H "Referer: https://www.nseindia.com/" --max-time 30 "$URL" || true)
            if [ "$CODE" = "200" ]; then
              echo "NSE ki $DAY file aa gayi -- 60 second baad signal banega"
              sleep 60
              exit 0
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "intezaar khatam: $DAY file nahi aayi (HTTP $CODE) -- chhutti ya NSE late, aage ke run sambhalenge"
              exit 0
            fi
            sleep 300
          done

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Engine install karo
        timeout-minutes: 10
        # Engine ka code dobara yahan nahi likha gaya. Bhavcopy parser,
        # corporate action parser aur adjustment classifier -- teenon wahin se
        # aate hain, taaki do jagah do jawab na banein. Dono repo public hain,
        # isliye iske liye koi token nahi chahiye.
        run: |
          python -m pip install --upgrade pip
          # Tested release: update this SHA only after engine tests and system verification.
          pip install "vajra-market-regime-engine @ git+https://github.com/sakilbeg756034-cell/vajra-market-data@272daed5508562e3026f4953fc41e4d181c22b3b"

      - name: Signal banao
        timeout-minutes: 25
        # Haath se chalaya run (workflow_dispatch) hamesha poora hisaab dobara
        # karta hai. Scheduled run me naya din na ho to daily.py turant ruk
        # jaata hai aur out/ waisa ka waisa rehta hai.
        run: |
          FORCE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then FORCE="--force"; fi
          python -m vajra_regime.cloud.daily --root . --scratch "$RUNNER_TEMP/nse" $FORCE

      - name: Natija commit karo
        timeout-minutes: 10
        run: |
          git config user.name  "vajra-bot"
          git config user.email "sakilbeg756034@gmail.com"
          ASOF=$(python -c "import json;print(json.load(open('out/status.json'))['as_of_session'])")

          # 1. out/ -- main par, POORA itihaas. Ye file chhoti hain (~100 KB)
          #    aur inka itihaas hi wo record hai ki system ne kis din kya kaha.
          git add out
          if git diff --cached --quiet; then
            echo "out/ me kuch nahi badla -- chhutti thi ya data pehle se tha"
          else
            git commit -m "signals: $ASOF"
            git push
          fi

          # 2. state/ -- `state` branch par, sirf EK commit. Har din purana
          #    mita kar naya. Isi se repo saalon tak chhota rehta hai.
          #    (Wajah upar "State laao" step me poori likhi hai.)
          if sha256sum state/* | diff -q - "$RUNNER_TEMP/state.before" > /dev/null; then
            echo "state nahi badla -- state branch par push ki zaroorat nahi"
            exit 0
          fi
          git checkout --orphan state-tmp
          git reset
          git add -f state
          git commit -q -m "state: $ASOF"
          git push -f origin state-tmp:state
          echo "state branch par force-push ho gaya (sirf ek commit)"
